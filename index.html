<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Asistanım</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🤖 AI Asistanım</div>
      <div class="header-actions">
        <span id="connStatus" class="conn-status">⚪ Köprü aranıyor...</span>
        <button id="settingsBtn" class="icon-btn" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="message bot">
          <div class="msg-content">Merhaba! Ben AI asistanınızım. Aşağıdaki açılır menüden model seçip mesajınızı yazın.</div>
        </div>
      </div>
    </main>

    <div class="input-area">
      <div class="model-bar">
        <select id="brainSelect" class="brain-select">
          <optgroup label="NaraRouter">
            <option value="nara:tencent-hy3-free" selected>Hy3 Free</option>
            <option value="nara:agnes-2.5-flash">Agnes 2.5 Flash</option>
          </optgroup>
          <optgroup label="NVIDIA NIM">
            <option value="nvidia:deepseek-ai/deepseek-v4-flash-0731">DeepSeek V4 Flash</option>
          </optgroup>
          <optgroup label="Airforce">
            <option value="airforce:mimo-v2.5-pro">MiMo v2.5 Pro</option>
          </optgroup>
          <optgroup label="Görsel Üretimi (Ücretsiz)">
            <option value="image:flux">🎨 Flux (Pollinations)</option>
            <option value="image:turbo">🎨 Turbo (Pollinations)</option>
          </optgroup>
        </select>
      </div>
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
        <button id="sendBtn" class="send-btn">Gönder</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ API Anahtarları</h2>
        <button id="closeSettings" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>NaraRouter API Key</label>
          <div class="key-row">
            <input type="password" id="naraKey" placeholder="sk-nry-...">
            <button onclick="saveKey('nara')" class="save-btn">Kaydet</button>
          </div>
          <small id="naraStatus" class="status-text"></small>
        </div>
        <div class="setting-group">
          <label>NVIDIA NIM API Key</label>
          <div class="key-row">
            <input type="password" id="nvidiaKey" placeholder="nvapi-...">
            <button onclick="saveKey('nvidia')" class="save-btn">Kaydet</button>
          </div>
          <small id="nvidiaStatus" class="status-text"></small>
        </div>
        <div class="setting-group">
          <label>Airforce API Key</label>
          <div class="key-row">
            <input type="password" id="airforceKey" placeholder="API Key...">
            <button onclick="saveKey('airforce')" class="save-btn">Kaydet</button>
          </div>
          <small id="airforceStatus" class="status-text"></small>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
