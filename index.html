<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Asistanım</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🤖 AI Asistanım</div>
      <div class="header-actions">
        <span id="connStatus" class="conn-status">⚪ Köprü aranıyor...</span>
        <button id="settingsBtn" class="icon-btn" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="message bot">
          <div class="msg-content">Merhaba! Ben AI asistanınızım. Aşağıdaki açılır menüden model seçip mesajınızı yazın.</div>
        </div>
      </div>
    </main>

    <div class="input-area">
      <div class="model-bar">
          <div class="custom-dropdown" id="customDropdown">
            <button class="dropdown-selected" id="dropdownSelected">
              <span class="selected-text">Agnes 2.5 Flash</span>
              <span class="selected-provider">NaraRouter</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-list" id="dropdownList">
              <div class="dropdown-toolbar">
                <div class="dropdown-search">
                  <input type="text" id="modelSearch" placeholder="Model ara (isim, @saglayici, $fiyat, #puan, #yetenek)" oninput="filterModels(this.value)">
                </div>
                <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilterPanel()">🔍 Filtreler</button>
              </div>
              <div class="filter-panel" id="filterPanel" style="display:none;">
                <div class="filter-section">
                  <label>🏢 Sağlayıcı</label>
                  <select id="filterProvider" onchange="filterModels()" multiple size="5">
                    <option value="">Tümü</option>
                  </select>
                </div>
                <div class="filter-section">
                  <label>💰 Fiyat</label>
                  <div class="filter-chips">
                    <button type="button" class="filter-chip" data-filter="price" data-value="ucretsiz" onclick="toggleFilterChip(this)">Ücretsiz</button>
                    <button type="button" class="filter-chip" data-filter="price" data-value="deneme" onclick="toggleFilterChip(this)">Deneme</button>
                    <button type="button" class="filter-chip" data-filter="price" data-value="ucretli" onclick="toggleFilterChip(this)">Ücretli</button>
                  </div>
                </div>
                <div class="filter-section">
                  <label>⭐ Puan</label>
                  <div class="filter-chips">
                    <button type="button" class="filter-chip" data-filter="rating" data-value="9" onclick="toggleFilterChip(this)">9-10</button>
                    <button type="button" class="filter-chip" data-filter="rating" data-value="7" onclick="toggleFilterChip(this)">7-8</button>
                    <button type="button" class="filter-chip" data-filter="rating" data-value="5" onclick="toggleFilterChip(this)">5-6</button>
                  </div>
                </div>
                <div class="filter-section">
                  <label>🛠️ Yetenek</label>
                  <div class="filter-chips" id="capabilityChips"></div>
                </div>
                <button class="filter-clear-btn" onclick="clearAllFilters()">Temizle</button>
              </div>
              <div id="modelOptions"></div>
            </div>
          </div>
        <div class="model-tooltip" id="modelTooltip"></div>
      </div>
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
        <button id="sendBtn" class="send-btn">Gönder</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h2>⚙️ API Anahtarları</h2>
        <button id="closeSettings" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-search">
          <input type="text" id="providerSearch" placeholder="Sağlayıcı ara..." oninput="filterProviders(this.value)">
        </div>
        <div class="provider-grid" id="providerGrid">
          <!-- JS ile doldurulacak -->
        </div>
      </div>
    </div>
  </div>

  <div id="providerModal" class="modal" style="display:none">
    <div class="modal-content provider-detail-modal">
      <div class="modal-header">
        <div class="provider-detail-title">
          <span id="pmIcon" class="pm-icon"></span>
          <h2 id="pmName"></h2>
          <span id="pmBadge" class="pm-badge"></span>
        </div>
        <button id="closeProviderModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="pm-section">
          <div class="pm-label">📌 Neden API Anahtarı Gerekli?</div>
          <p id="pmWhy" class="pm-desc"></p>
        </div>
        <div class="pm-row">
          <div class="pm-col">
            <div class="pm-label">🌐 API Adresi</div>
            <a id="pmUrl" href="#" target="_blank" class="pm-url"></a>
          </div>
          <div class="pm-col">
            <div class="pm-label">🤖 Modeller</div>
            <div id="pmModels" class="pm-models"></div>
          </div>
        </div>
        <div class="pm-row">
          <div class="pm-col">
            <div class="pm-label">💰 Fiyatlandırma</div>
            <div id="pmPricing" class="pm-pricing"></div>
          </div>
          <div class="pm-col">
            <div class="pm-label">⏱️ Limitler</div>
            <div id="pmLimit" class="pm-limit"></div>
          </div>
        </div>
        <div class="pm-section">
          <div class="pm-label">🔐 API Anahtarınızı Girin</div>
          <div class="pm-keyformat">Beklenen format: <code id="pmKeyFormat"></code></div>
          <div class="key-row">
            <input type="password" id="pmKeyInput" placeholder="API anahtarınızı buraya yapıştırın...">
            <button onclick="saveProviderKey()" class="save-btn">Kaydet</button>
          </div>
          <small id="pmStatus" class="status-text"></small>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
