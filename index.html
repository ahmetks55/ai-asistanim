<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Asistanım</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🤖 AI Asistanım</div>
      <div class="header-actions">
        <select id="brainSelect" class="brain-select">
          <option value="nara">NaraRouter (Mimo)</option>
          <option value="nvidia">NVIDIA NIM</option>
          <option value="airforce">Airforce</option>
        </select>
        <button id="settingsBtn" class="icon-btn" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="message bot">
          <div class="msg-content">Merhaba! Ben AI asistanınızım. Size nasıl yardımcı olabilirim?</div>
        </div>
      </div>
    </main>

    <div class="input-area">
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
        <button id="sendBtn" class="send-btn">Gönder</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ API Anahtarları</h2>
        <button id="closeSettings" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-info">Key'leri sunucu tarafında saklanır. Köprü sunucusu (server.js) çalışırken ayarlanır.</p>
        <div class="setting-group">
          <label>NVIDIA NIM API Key</label>
          <div class="key-row">
            <input type="password" id="nvidiaKey" placeholder="nvapi-...">
            <button onclick="saveKey('nvidia')" class="save-btn">Kaydet</button>
          </div>
          <small id="nvidiaStatus" class="status-text"></small>
        </div>
        <div class="setting-group">
          <label>NaraRouter API Key</label>
          <div class="key-row">
            <input type="password" id="naraKey" placeholder="sk-nry-...">
            <button onclick="saveKey('nara')" class="save-btn">Kaydet</button>
          </div>
          <small id="naraStatus" class="status-text"></small>
        </div>
        <div class="setting-group">
          <label>Airforce API Key</label>
          <div class="key-row">
            <input type="password" id="airforceKey" placeholder="API Key...">
            <button onclick="saveKey('airforce')" class="save-btn">Kaydet</button>
          </div>
          <small id="airforceStatus" class="status-text"></small>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
