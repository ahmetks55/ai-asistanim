<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Asistanım</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🤖 AI Asistanım</div>
      <div class="header-actions">
        <span id="connStatus" class="conn-status">⚪ Köprü aranıyor...</span>
        <button id="settingsBtn" class="icon-btn" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="message bot">
          <div class="msg-content">Merhaba! Ben AI asistanınızım. Aşağıdaki açılır menüden model seçip mesajınızı yazın.</div>
        </div>
      </div>
    </main>

    <div class="input-area">
      <div class="model-bar">
          <div class="custom-dropdown" id="customDropdown">
            <button class="dropdown-selected" id="dropdownSelected">
              <span class="selected-text">Agnes 2.5 Flash</span>
              <span class="selected-provider">NaraRouter</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-list" id="dropdownList">
              <div class="dropdown-toolbar">
                <div class="dropdown-search">
                  <input type="text" id="modelSearch" placeholder="Model ara (puan, yetenek...)" oninput="filterModels(this.value)">
                </div>
                <div class="dropdown-filters">
                  <div class="filter-group">
                    <select id="filterProvider" onchange="filterModels()">
                      <option value="">Tüm Sağlayıcılar</option>
                    </select>
                  </div>
                  <div class="filter-group">
                    <select id="filterPrice" onchange="filterModels()">
                      <option value="">Tüm Fiyatlar</option>
                      <option value="ucretsiz">Ücretsiz</option>
                      <option value="deneme">Deneme</option>
                      <option value="ucretli">Ücretli</option>
                    </select>
                  </div>
                  <div class="filter-group">
                    <select id="filterRating" onchange="filterModels()">
                      <option value="">Tüm Puanlar</option>
                      <option value="9">9-10 Puan</option>
                      <option value="7">7-8 Puan</option>
                      <option value="5">5-6 Puan</option>
                    </select>
                  </div>
                  <div class="filter-group">
                    <select id="filterCap" onchange="filterModels()">
                      <option value="">Tüm Yetenekler</option>
                      <option value="Kod Yazma">Kod Yazma</option>
                      <option value="Kod Analizi">Kod Analizi</option>
                      <option value="Matematik">Matematik</option>
                      <option value="Çeviri">Çeviri</option>
                      <option value="Görsel Anlama">Görsel Anlama</option>
                      <option value="Uzun Bağlam">Uzun Bağlam</option>
                      <option value="Mantıksal Çıkarım">Mantıksal Çıkarım</option>
                      <option value="Yaratıcı Yazarlık">Yaratıcı Yazarlık</option>
                      <option value="Araştırma">Araştırma</option>
                      <option value="Veri Analizi">Veri Analizi</option>
                      <option value="Sohbet">Sohbet</option>
                    </select>
                  </div>
                </div>
              </div>
              <div id="modelOptions"></div>
            </div>
          </div>
        <div class="model-tooltip" id="modelTooltip"></div>
      </div>
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
        <button id="sendBtn" class="send-btn">Gönder</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h2>⚙️ API Anahtarları</h2>
        <button id="closeSettings" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-search">
          <input type="text" id="providerSearch" placeholder="Sağlayıcı ara..." oninput="filterProviders(this.value)">
        </div>
        <div class="provider-grid" id="providerGrid">
          <!-- JS ile doldurulacak -->
        </div>
      </div>
    </div>
  </div>

  <div id="providerModal" class="modal" style="display:none">
    <div class="modal-content provider-detail-modal">
      <div class="modal-header">
        <div class="provider-detail-title">
          <span id="pmIcon" class="pm-icon"></span>
          <h2 id="pmName"></h2>
          <span id="pmBadge" class="pm-badge"></span>
        </div>
        <button id="closeProviderModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="pm-section">
          <div class="pm-label">📌 Neden API Anahtarı Gerekli?</div>
          <p id="pmWhy" class="pm-desc"></p>
        </div>
        <div class="pm-row">
          <div class="pm-col">
            <div class="pm-label">🌐 API Adresi</div>
            <a id="pmUrl" href="#" target="_blank" class="pm-url"></a>
          </div>
          <div class="pm-col">
            <div class="pm-label">🤖 Modeller</div>
            <div id="pmModels" class="pm-models"></div>
          </div>
        </div>
        <div class="pm-row">
          <div class="pm-col">
            <div class="pm-label">💰 Fiyatlandırma</div>
            <div id="pmPricing" class="pm-pricing"></div>
          </div>
          <div class="pm-col">
            <div class="pm-label">⏱️ Limitler</div>
            <div id="pmLimit" class="pm-limit"></div>
          </div>
        </div>
        <div class="pm-section">
          <div class="pm-label">🔐 API Anahtarınızı Girin</div>
          <div class="pm-keyformat">Beklenen format: <code id="pmKeyFormat"></code></div>
          <div class="key-row">
            <input type="password" id="pmKeyInput" placeholder="API anahtarınızı buraya yapıştırın...">
            <button onclick="saveProviderKey()" class="save-btn">Kaydet</button>
          </div>
          <small id="pmStatus" class="status-text"></small>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
